name: fastapi-microservice  # Name of the conda environment
channels:
  - conda-forge             # Preferred channel for packages
  - defaults
dependencies:
  - python=3.11             # Specify Python version
  - pip                     # Ensure pip is installed
  - fastapi                 # FastAPI framework
  - uvicorn                 # ASGI server
  - python-dotenv           # For loading .env files
  - httpx                   # Async HTTP client
  - python-multipart        # For handling file uploads
  - pydantic-settings       # For managing configuration
  - pip:                    # Use pip for packages not available in conda
      - openai              # OpenAI API client
      - langchain           # LangChain for RAG
      - chromadb            # Vector database for RAG
